name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Frontend and package build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: video_annotator/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: video_annotator/frontend
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        working-directory: video_annotator/frontend
        run: npm run build

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: latest

      - name: Set up Python
        run: uv python install 3.11

      - name: Build package
        run: uv build
